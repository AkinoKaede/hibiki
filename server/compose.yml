services:
  server:
    image: hibiki-server:local
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "hibiki-server", "health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    ports:
      - "127.0.0.1:7749:7749"
    volumes:
      - server-data:/var/lib/hibiki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  server-data:
