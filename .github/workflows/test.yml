name: test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-release-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r ios/scripts/release-requirements.txt
      - run: python3 -m unittest discover -s ios/scripts -p test_release.py
      - run: python3 -m unittest discover -s scripts -p test_set_version.py
      - run: shellcheck ios/scripts/release.sh
  localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./ios/scripts/check-zh-localization.sh
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GnuPG (Linux 2.4)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnupg
      - name: Install GnuPG (macOS)
        if: runner.os == 'macOS'
        run: brew list gnupg >/dev/null 2>&1 || brew install gnupg
      - run: gpg --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace --all-targets
      - run: python3 tests/server.py
      - run: python3 tests/integration.py
      - run: python3 tests/mobile.py
      - run: python3 tests/mobile_tls.py
