name: build
on:
  push:
    paths: &build-paths
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock
      - .cargo/**
      - scripts/package.py
      - scripts/check-version.py
      - packaging/**
      - examples/**
      - tests/server.py
      - README.md
      - ARCHITECTURE.md
      - USAGE.md
      - .github/workflows/build.yml
  pull_request:
    paths: *build-paths
  workflow_dispatch:
    inputs:
      build:
        description: 'Build desktop packages, upload iOS to App Store Connect, or both'
        required: true
        default: all
        type: choice
        options:
          - all
          - desktop
          - ios
      version:
        description: 'Version matching Cargo.toml, without v (e.g. 0.1.0); tag adds v automatically'
        required: true
        type: string
      ios_build_number:
        description: 'iOS build number (default: next available number from App Store Connect)'
        required: false
        type: string
      prereleased:
        description: 'Mark the draft as a prerelease'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: build-${{ github.event_name }}-${{ inputs.build || 'desktop' }}-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and existing tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          version = os.environ['RELEASE_VERSION']
          subprocess.run(['python3', 'scripts/check-version.py', version], check=True)
          if os.environ['BUILD'] == 'ios':
              raise SystemExit(0)
          tag = f'v{version}'
          existing = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], capture_output=True, text=True)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if existing.returncode == 0 and existing.stdout.strip() != head:
              raise SystemExit('Existing tag points to a different commit; select that tag in Run workflow')
          PYCODE
  package:
    if: github.event_name != 'workflow_dispatch' || inputs.build != 'ios'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/packages'
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release archives
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: python3 scripts/package.py --target "${{ matrix.target }}"
      - name: Smoke test packaged binaries
        shell: bash
        run: |
          mkdir unpacked
          for archive in dist/*.tar.xz; do
            tar -xJf "$archive" -C unpacked
          done
          for binary in unpacked/*/bin/*; do
            "$binary" --version
          done
          python3 tests/server.py --server unpacked/hibiki-server-*/bin/hibiki-server
      - name: Verify musl binaries are static
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          for binary in unpacked/*/bin/*; do
            headers="$(readelf -l "$binary")"
            if [[ "$headers" == *INTERP* ]]; then
              echo "Unexpected dynamic interpreter: $binary" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.build != 'ios'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Verify archives and combine checksums
        working-directory: dist
        run: |
          sha256sum --check ./*.sha256
          cat ./*.sha256 > SHA256SUMS
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ inputs.version }}
          PRERELEASED: ${{ inputs.prereleased }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          options=(--draft --generate-notes --target "$RELEASE_COMMIT")
          if [[ "$PRERELEASED" == 'true' ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.tar.xz dist/SHA256SUMS "${options[@]}"

  ios:
    name: Build and upload iOS
    if: github.event_name == 'workflow_dispatch' && (inputs.build == 'ios' || inputs.build == 'all')
    needs: validate
    runs-on: macos-15
    timeout-minutes: 90
    concurrency:
      group: ios-app-store-connect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-release-xcode-26.3
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hibiki-source-packages
          key: ios-spm-26.3-${{ hashFiles('ios/Hibiki.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Install release dependencies and check release tooling
        run: |
          python3 -m pip install -r ios/scripts/release-requirements.txt
          python3 -m unittest discover -s ios/scripts -p 'test_release.py'
          ./ios/scripts/check-zh-localization.sh
      - name: Archive and upload to App Store Connect
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATES_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATES_P12 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          IOS_VERSION: ${{ inputs.version }}
          IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
        run: ./ios/scripts/release.sh
      - name: Save iOS build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ios/build-release/export/*.ipa
            ios/build-release/*.dSYMs.zip
            ios/build-release/*.log
          if-no-files-found: ignore
          retention-days: 14
