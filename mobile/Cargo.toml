[package]
name = "hibiki-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "hibiki_mobile"

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "hibiki-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
hibiki-lib.workspace = true
hibiki-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zeroize.workspace = true
hex.workspace = true
sha2.workspace = true
uniffi = { version = "0.32.2", features = ["tokio"] }
openpgp-card = "0.7.0"
card-backend = "0.2.0"
sha1 = "0.10"
secrecy = "0.10"

[dev-dependencies]
serde_json = "1"
tempfile.workspace = true
