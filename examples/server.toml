# Default local address; expose through a TLS endpoint for remote use.
listen = "127.0.0.1:7749"
# Relative to this configuration file. The parent directory must be owned by
# the running user and have mode 0700.
database = "data/hibiki.sqlite3"
# Allow authenticated clients to create channels (default: true).
# Set false to reserve creation for the server administrator. Existing member
# management and claiming server-created channels remain available.
allow_client_channel_creation = true
