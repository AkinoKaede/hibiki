# Run hibiki init on each device; never copy another device's identity.bin.
server = "wss://hibiki.example.com/hibiki"
allow_insecure = false
operation_timeout_seconds = 120
gpgconf_program = "gpgconf"
# hibiki use NAME stores the immutable channel ID. Each adapter session keeps
# the selection it started with.
# default_channel = "..."

# These switches control local providers. Remote requests work with both off.
# Restart hibiki daemon after changing configuration.
[scdaemon]
enabled = true
# Omit program to locate the native binary with gpgconf --list-components.
# scdaemon runs with --server and a dedicated home under Hibiki's data directory.
# program = "/usr/lib/gnupg/scdaemon"

[pinentry]
enabled = true
# Omit program to locate the native binary with gpgconf --list-components.
# This may select a terminal Pinentry. Set program to a GUI Pinentry for a
# background service; terminal input requires this device's GPG_TTY and TERM
# in the daemon environment.
# program = "/opt/homebrew/bin/pinentry-mac"
