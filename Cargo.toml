[workspace]
members = ["lib", "server", "client", "core", "mobile"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"

[workspace.dependencies]
hibiki-lib = { path = "lib" }
hibiki-core = { path = "core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
postcard = { version = "1", features = ["alloc"] }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
toml = "1.1"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
anstream = "1"
anstyle = "1"
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls"] }
snow = "0.10"
ed25519-dalek = "3"
getrandom = "0.4"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
bip39 = { version = "3", default-features = false, features = ["std"] }
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
fs2 = "0.4"
libc = "0.2"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Integration tests exercise many signed membership and Noise messages per PIN
# inquiry. Optimize dependencies so debug crypto does not consume operation
# deadlines on slower CI CPUs; workspace code retains normal debug settings.
[profile.dev.package."*"]
opt-level = 2
