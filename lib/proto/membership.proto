// hibiki/4: never reuse tags or enum values; reserve deleted names and numbers.
syntax = "proto3";
package hibiki.v4;

message Device {
  string name = 1;
  bytes signing_key = 2;
  bytes noise_key = 3;
  bytes binding = 4;
}

message GenesisBody {
  reserved 1, 5;
  reserved "version", "psk_commitment";
  string id = 2;
  string name = 3;
  Device founder = 4;
}

message ChannelGenesis {
  GenesisBody body = 1;
  bytes signature = 2;
}

message EventBody {
  string channel_id = 1;
  uint64 sequence = 2;
  bytes previous_event_hash = 3;
  MembershipAction action = 4;
  string issuer_device_id = 5;
  uint64 issued_at = 6;
}

message MembershipEvent {
  EventBody body = 1;
  bytes signature = 2;
}

message MembershipProof {
  ChannelGenesis genesis = 1;
  repeated MembershipEvent events = 2;
}

message MembershipAction {
  reserved 1, 3, 7;
  reserved "admit", "change_psk", "enable_invitations";
  oneof kind {
    MembershipActionRevoke revoke = 2;
    MembershipActionLeave leave = 4;
    MembershipActionRename rename = 5;
    MembershipActionRevokeSubtree revoke_subtree = 6;
    AdmissionRequest accept = 8;
  }
}

message MembershipActionRevoke {
  string device_id = 1;
}

message MembershipActionLeave {
}

message MembershipActionRename {
  Device device = 1;
}

message MembershipActionRevokeSubtree {
  string device_id = 1;
}

// Canonical signed v4 data; preserving its Postcard bytes is part of the signature contract.
message AdmissionRequest { bytes canonical = 1; }
message InvitationMetadata { bytes canonical = 1; }
message OneTimeInvitation { InvitationMetadata metadata = 1; bytes key = 2; }
